name: Happs
description: >-
  Happs was a live-streaming platform for creators and citizen journalists that
  let broadcasters produce real-time news and multicast a single live stream
  simultaneously to Facebook, YouTube, Twitter/X, Twitch and other destinations,
  with built-in studio tools and viewer monetization through tips and monthly
  sponsorships. Originally launched as a home for independent journalists, it
  expanded into a general creator social network and ran its live video on
  Amazon Interactive Video Service (Amazon IVS). The company raised roughly
  $4.7M in a post-seed round led by Bullpen Capital and Crosslink Capital, and
  wound down operations around 2022. This profile is retained in the API
  Evangelist network as a portfolio-lead record; no public developer program,
  API, or live web surface remains.
